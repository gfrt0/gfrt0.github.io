<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
        {{ with .Site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
        <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
        <meta property="og:type" content="website">
        <meta property="og:url" content="{{ .Permalink }}">
        {{ with .Site.Params.description }}<meta property="og:description" content="{{ . }}">{{ end }}
        {{ with .Site.Params.logo }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
        <link rel="canonical" href="{{ .Permalink }}">
        <link rel="stylesheet" href="{{ "/css/style.css" | relURL }}">
        <link rel="shortcut icon" type="image/x-icon" href="{{ "/favicon.ico" | relURL }}">
    </head>
    <body>
        <div class="wrapper">
            <header>
                <h1>{{ .Site.Title }}</h1>

                <!-- begin short bio -->
                <p>{{ .Site.Params.shortbio }}</p>
                <!-- end short bio -->

                <p class="contactinfo">
                <img src="{{ "/icons/mail-symbol.svg" | relURL }}" class="octicons">
                {{ partial "mail.html" . }}
                </p>

                <hr/>

                {{ partial "sidebar.html" . }}

                <!-- begin photo -->
                {{ with .Site.Params.logo }}
                <img src="{{ . | relURL }}" alt="{{ $.Site.Title }}" />
                {{ end }}
                <!-- end photo -->

            </header>
