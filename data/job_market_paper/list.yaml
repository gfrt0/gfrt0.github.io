works:

- title: "Buyer and Seller Value of Online Ratings"
  pdflink: "https://forte-papers.forteg100.workers.dev/Forte_JMP_OnlineRatings.pdf"
  abstract: >
      Online ratings guide buyers in many markets, but how much they are
      worth, and to whom, depends on how sellers respond to the information
      they carry. I develop a framework that captures the learning,
      consideration and price-competition effects of ratings, and use it to
      measure the gains from ratings across consumers and sellers of
      heterogeneous quality. In an application to the California photovoltaic
      market, where I am able to match Google and Yelp ratings to residential
      installations, I find that ratings raise consumer surplus by 3.4% over
      2016&ndash;2022, closing 76% of the difference between no ratings and
      full information. A decomposition of the channels through which ratings
      affect consumer choices attributes 66% of consumers' gain to which
      installers they ask for quotes, and only 8% to their choice among the
      quotes they hold. Installers' profits rise by 2.1%, with high-quality
      installers gaining and low-quality ones losing. The concern that better
      information softens price competition is not borne out in this market:
      average markups barely respond to ratings.
  presentations:
    - text: "CEPR IO Virtual Gathering 2026"
      url: "https://cepr.org/events/cepr-io-virtual-gathering-2026"
