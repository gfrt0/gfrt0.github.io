works:

- title: "In the Stars: Buyer and Seller Value of Online Ratings"
  abstract: >
      Online ratings are a controversial determinant of consumer choices and
      firm fates. Their availability has unclear net and distributional welfare
      effects across buyers and heterogeneous sellers. I develop a model to
      quantify these effects, which I apply to data from the California
      residential photovoltaic market. I find that ratings raise consumer
      surplus by $65.8 million over 2016&ndash;2022, closing 76% of the gap to
      full information. Ratings redistribute sales and profits from low-quality
      firms to high-quality ones, and they raise total producer surplus.
      Ratings transfer surplus predominantly by redirecting sales, rather than
      by affecting prices. Most of the consumers' gain comes from which
      installers they ask for quotes, rather than from their choice among the
      quotes they receive.
